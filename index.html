<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>East Cobb League</title>
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-512.png">
<meta name="apple-mobile-web-app-title" content="East Cobb League">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#10151c">
<style>
  :root {
    --bg: #10151c;
    --surface: #1b222c;
    --surface-raised: #222b37;
    --border: #2c3542;
    --text: #edeff2;
    --text-muted: #8892a0;
    --win: #5fb85a;
    --loss: #d9634a;
    --gold: #d9a441;
    --tie: #8892a0;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    font-variant-numeric: tabular-nums;
    min-height: 100vh;
  }
  .wrap { max-width: 1140px; margin: 0 auto; padding: 28px 20px 80px; }

  /* Header */
  header.top {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    border-bottom: 2px solid var(--border);
    padding-bottom: 16px;
    margin-bottom: 22px;
    flex-wrap: wrap;
    gap: 10px;
  }
  header.top h1 {
    font-size: 22px;
    font-weight: 800;
    letter-spacing: -0.02em;
    margin: 0;
  }
  header.top .meta {
    color: var(--text-muted);
    font-size: 13px;
  }

  /* Loader / file picker */
  .loader-card {
    border: 1px dashed var(--border);
    border-radius: 10px;
    padding: 40px 24px;
    text-align: center;
    background: var(--surface);
  }
  .loader-card h2 { margin: 0 0 8px; font-size: 17px; }
  .loader-card p { color: var(--text-muted); font-size: 14px; margin: 0 0 20px; max-width: 480px; margin-left: auto; margin-right: auto; }
  .file-btn {
    display: inline-block;
    background: var(--gold);
    color: #1a1300;
    font-weight: 700;
    padding: 10px 20px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 14px;
    border: none;
  }
  .file-btn:hover { filter: brightness(1.08); }
  #fileInput { display: none; }
  .err { color: var(--loss); font-size: 13px; margin-top: 14px; }

  /* Tabs */
  nav.tabs {
    display: flex;
    gap: 2px;
    margin-bottom: 22px;
    border-bottom: 1px solid var(--border);
  }
  nav.tabs button {
    background: none;
    border: none;
    color: var(--text-muted);
    font-size: 14px;
    font-weight: 700;
    padding: 10px 4px;
    margin-right: 22px;
    cursor: pointer;
    border-bottom: 2px solid transparent;
    letter-spacing: 0.01em;
  }
  nav.tabs button.active {
    color: var(--text);
    border-bottom-color: var(--gold);
  }

  .view { display: none; }
  .view.active { display: block; }

  /* Standings tables */
  section.block { margin-bottom: 34px; }
  section.block h2 {
    font-size: 14px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--text-muted);
    font-weight: 700;
    margin: 0 0 4px;
  }
  section.block .sub { color: var(--text-muted); font-size: 12.5px; margin: 0 0 12px; }

  table { width: 100%; border-collapse: collapse; }
  th, td { padding: 9px 8px; text-align: left; font-size: 14px; }
  thead th {
    color: var(--text-muted);
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    font-weight: 700;
    border-bottom: 1px solid var(--border);
  }
  tbody tr { border-bottom: 1px solid var(--border); }
  tbody tr:last-child { border-bottom: none; }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
  td.rank { color: var(--text-muted); width: 28px; }
  td.team { font-weight: 600; }
  tr.rank1 td.rank { color: var(--gold); font-weight: 800; }

  /* Matchups */
  .week-picker { display: flex; align-items: center; gap: 10px; margin-bottom: 18px; }
  .week-picker select {
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 7px 10px;
    border-radius: 6px;
    font-size: 14px;
  }
  .matchup-grid { display: grid; gap: 10px; }
  .matchup-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 14px 16px;
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    gap: 10px;
    cursor: pointer;
  }
  .matchup-card:hover { border-color: var(--gold); }
  .side { display: flex; flex-direction: column; gap: 2px; }
  .side.away { text-align: right; align-items: flex-end; }
  .side .name { font-weight: 700; font-size: 14.5px; }
  .side .score { font-size: 22px; font-weight: 800; }
  .side.winner .score { color: var(--win); }
  .vs { color: var(--text-muted); font-size: 12px; font-weight: 700; padding: 0 6px; }

  /* Box score */
  .back-link {
    color: var(--gold);
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
    display: inline-block;
    margin-bottom: 16px;
  }
  .box-header {
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    margin-bottom: 20px;
    gap: 10px;
  }
  .box-header .score { font-size: 30px; font-weight: 800; }
  .box-header .away { text-align: right; }
  .whatif { font-size: 12px; color: var(--text-muted); margin-top: 2px; }
  .whatif-diff { color: var(--gold); font-weight: 700; }
  .roster-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
  @media (max-width: 640px) { .roster-grid { grid-template-columns: 1fr; } }
  .roster-grid table td, .roster-grid table th { font-size: 13px; padding: 6px 4px; }
  td.slot { color: var(--text-muted); font-size: 11px; width: 42px; }
  .bench-divider td { color: var(--text-muted); font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em; padding-top: 14px; border-bottom: none; }
  tr.outperformed td { color: var(--loss); }
  tr.outperformed td.slot { color: var(--loss); opacity: 0.85; }
  tr.should-start td { color: var(--win); }
  tr.should-start td.slot { color: var(--win); opacity: 0.85; }

  .placeholder { color: var(--text-muted); font-size: 14px; padding: 30px 0; text-align: center; }

  /* Wide tables (Standings Comparison, Position Breakdown, Weekly Scoring) */
  .table-scroll { overflow-x: auto; }
  .table-scroll table { table-layout: auto; width: auto; }
  .table-scroll td:first-child, .table-scroll th:first-child {
    max-width: 140px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  /* Streaks / luck index colors */
  .streak-w { color: var(--win); font-weight: 700; }
  .streak-l { color: var(--loss); font-weight: 700; }
  .streak-t { color: var(--tie); font-weight: 700; }
  .luck-pos { color: var(--win); }
  .luck-neg { color: var(--loss); }
  .luck-zero { color: var(--text-muted); }

  /* Sortable table headers */
  th.sortable { cursor: pointer; user-select: none; }
  th.sortable:hover { color: var(--text); }

  /* Compact side-by-side tables (Weekly High/Low Scorers) */
  .compact-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
  @media (max-width: 640px) { .compact-grid { grid-template-columns: 1fr; } }
  .compact-grid table th, .compact-grid table td { font-size: 12.5px; padding: 6px 8px; }
  .compact-label { font-size: 12.5px; font-weight: 700; margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.05em; }

  /* Tight, dense table (Weekly Scoring — many week columns) */
  .tight-table th, .tight-table td { font-size: 12px; padding: 5px 7px; white-space: nowrap; }
  .tight-table td.team, .tight-table th:first-child { white-space: normal; }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1 id="leagueTitle">League Tracker</h1>
    <div class="meta" id="leagueMeta"></div>
    <button class="file-btn" id="headerSyncBtn" style="display:none; padding:6px 14px; font-size:12.5px;" onclick="autoLoad()">Refresh</button>
  </header>

  <div id="loaderCard" class="loader-card">
    <h2>Loading league data...</h2>
    <p id="loaderText">Fetching the latest synced data. If this is your first visit right after setup, the Action may not have run yet — trigger it manually from the Actions tab, or load a file below.</p>
    <label class="file-btn" for="fileInput" style="background:transparent; color:var(--text); border:1px solid var(--border);">Choose league_data.json</label>
    <input type="file" id="fileInput" accept="application/json">
    <div class="err" id="loadErr"></div>
  </div>

  <div id="app" style="display:none;">
    <nav class="tabs">
      <button data-tab="standings" class="active">Standings</button>
      <button data-tab="matchups">Matchups</button>
      <button data-tab="boxscore">Box Score</button>
      <button data-tab="teamcompare">Team Comparison</button>
      <button data-tab="draftrecap">Draft Recap</button>
    </nav>

    <div id="view-standings" class="view active"></div>
    <div id="view-matchups" class="view"></div>
    <div id="view-boxscore" class="view"></div>
    <div id="view-teamcompare" class="view"></div>
    <div id="view-draftrecap" class="view"></div>
  </div>
</div>

<script>
const BUY_IN = 100;
const WEEKLY_PRIZE = 30;
const FIRST_PLACE_PRIZE = 500;
const SECOND_PLACE_PRIZE = 250;

let LEAGUE = null;   // raw loaded JSON for the CURRENTLY SELECTED season
let ALL_SEASONS = {}; // season (string) -> that season's league data, same shape LEAGUE used to be
let AVAILABLE_SEASONS = []; // sorted descending, e.g. [2026, 2025]
let CURRENT_SEASON = null;
let TEAMS = {};      // id -> team object
let WEEKLY = {};      // week -> [{teamId, points}]
let MATCHUPS_BY_WEEK = {}; // week -> [{home, away, homeScore, awayScore, homeId, awayId}]
let CURRENT_BOX = null;
let CHAMP_TOGGLE_STATE = false;

const SLOT_NAMES = {
  0: "QB", 1: "TQB", 2: "RB", 3: "RB/WR", 4: "WR", 5: "WR/TE", 6: "TE",
  7: "OP", 16: "D/ST", 17: "K", 20: "BE", 21: "IR", 23: "FLEX", 24: "EDR"
};

async function autoLoad() {
  const errEl = document.getElementById('loadErr');
  const loaderText = document.getElementById('loaderText');
  try {
    const res = await fetch('league_data.json?_=' + Date.now()); // cache-bust so Refresh actually refreshes
    if (!res.ok) throw new Error('No data file found yet (' + res.status + ')');
    const data = await res.json();
    loadLeague(data);
    if (errEl) errEl.textContent = '';
  } catch (err) {
    if (loaderText) loaderText.textContent = 'Could not auto-load league_data.json (' + err.message + '). Trigger the "Sync ESPN Data" workflow from the Actions tab, or load a file manually below.';
  }
}

window.addEventListener('DOMContentLoaded', autoLoad);

document.getElementById('fileInput').addEventListener('change', function(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(ev) {
    try {
      const data = JSON.parse(ev.target.result);
      loadLeague(data);
    } catch (err) {
      document.getElementById('loadErr').textContent = 'Could not parse this file: ' + err.message;
    }
  };
  reader.readAsText(file);
});

function teamName(t) {
  if (!t) return 'Unknown';
  if (t.name) return t.name;
  return [t.location, t.nickname].filter(Boolean).join(' ') || ('Team ' + t.id);
}

function loadLeague(data) {
  try {
    // Back-compat: older synced JSON (pre-multi-season) is a flat single
    // season object at the root, with no "seasons" key. Wrap it into the
    // same shape as the new format so everything downstream can assume
    // multi-season structure without special-casing it.
    if (data && data.seasons) {
      ALL_SEASONS = data.seasons;
      AVAILABLE_SEASONS = (data.availableSeasons && data.availableSeasons.length)
        ? data.availableSeasons
        : Object.keys(data.seasons).map(Number).sort((a, b) => b - a);
    } else if (data && data.season) {
      ALL_SEASONS = { [String(data.season)]: data };
      AVAILABLE_SEASONS = [data.season];
    } else {
      throw new Error('Unrecognized league_data.json format');
    }

    document.getElementById('loaderCard').style.display = 'none';
    document.getElementById('app').style.display = 'block';
    document.getElementById('headerSyncBtn').style.display = 'inline-block';

    activateSeason(AVAILABLE_SEASONS[0]);
  } catch (err) {
    document.getElementById('loadErr').textContent = 'Error reading league data: ' + err.message;
  }
}

// Switches the whole app to a different season's data. Every tab reads from
// the TEAMS/WEEKLY/MATCHUPS_BY_WEEK/LEAGUE globals, so once those are
// swapped and season-scoped caches are cleared, re-rendering the currently
// visible tab (and pre-rendering Matchups, matching the original eager-load
// behavior) is all that's needed -- no other tab-specific code has to know
// seasons exist.
function activateSeason(season) {
  CURRENT_SEASON = season;
  LEAGUE = ALL_SEASONS[String(season)];
  if (!LEAGUE) return;

  TEAMS = {};
  (LEAGUE.teams || []).forEach(t => { TEAMS[t.id] = t; });

  buildWeeklyAndMatchups(LEAGUE);

  // Season-scoped caches/state that must not leak between seasons
  draftPlayerInfoCache = null;
  draftRecapFilters = { team: 'all', pos: 'all' };
  draftRecapAllPicks = [];
  document.getElementById('view-boxscore').innerHTML = '';

  document.getElementById('leagueTitle').textContent = LEAGUE.leagueName || 'League Tracker';
  document.getElementById('leagueMeta').textContent =
    (LEAGUE.season || '') + ' Season · ' + Object.keys(TEAMS).length + ' Teams · Through Week ' + (LEAGUE.currentWeek || '?');

  renderStandings();
  renderMatchupsTab();
}

function buildWeeklyAndMatchups(data) {
  WEEKLY = {};
  MATCHUPS_BY_WEEK = {};
  (data.schedule || []).forEach(m => {
    const wk = m.matchupPeriodId;
    if (!wk) return;
    const home = m.home, away = m.away;
    if (!home) return;
    const homeDone = typeof home.totalPoints === 'number' && home.totalPoints > 0;
    const awayDone = away && typeof away.totalPoints === 'number' && away.totalPoints > 0;

    if (homeDone) {
      WEEKLY[wk] = WEEKLY[wk] || [];
      WEEKLY[wk].push({ teamId: home.teamId, points: home.totalPoints });
    }
    if (away && awayDone) {
      WEEKLY[wk] = WEEKLY[wk] || [];
      WEEKLY[wk].push({ teamId: away.teamId, points: away.totalPoints });
    }

    MATCHUPS_BY_WEEK[wk] = MATCHUPS_BY_WEEK[wk] || [];
    MATCHUPS_BY_WEEK[wk].push({
      homeId: home.teamId,
      awayId: away ? away.teamId : null,
      homeScore: home.totalPoints || 0,
      awayScore: away ? (away.totalPoints || 0) : null,
      winner: m.winner
    });
  });
}

function median(arr) {
  const s = [...arr].sort((a, b) => a - b);
  const n = s.length;
  if (n === 0) return null;
  const mid = Math.floor(n / 2);
  return n % 2 !== 0 ? s[mid] : (s[mid - 1] + s[mid]) / 2;
}

function computeStandardStandings() {
  return Object.values(TEAMS).map(t => {
    const rec = (t.record && t.record.overall) || {};
    return {
      id: t.id,
      name: teamName(t),
      wins: rec.wins || 0,
      losses: rec.losses || 0,
      ties: rec.ties || 0,
      pf: rec.pointsFor || 0,
      pa: rec.pointsAgainst || 0
    };
  }).sort((a, b) => b.wins - a.wins || b.pf - a.pf);
}

function computeMedianStandings() {
  const tally = {};
  Object.keys(TEAMS).forEach(id => { tally[id] = { wins: 0, losses: 0, ties: 0, pf: 0 }; });

  Object.entries(WEEKLY).forEach(([wk, scores]) => {
    if (scores.length < 2) return; // not enough data for this week yet
    const med = median(scores.map(s => s.points));
    scores.forEach(s => {
      if (!tally[s.teamId]) tally[s.teamId] = { wins: 0, losses: 0, ties: 0, pf: 0 };
      tally[s.teamId].pf += s.points;
      if (s.points > med) tally[s.teamId].wins++;
      else if (s.points < med) tally[s.teamId].losses++;
      else tally[s.teamId].ties++;
    });
  });

  return Object.entries(tally).map(([id, v]) => ({
    id, name: teamName(TEAMS[id]), ...v
  })).sort((a, b) => b.wins - a.wins || b.pf - a.pf);
}

function computeWeeklyHighScores() {
  return Object.entries(WEEKLY)
    .filter(([wk, scores]) => scores.length > 0)
    .map(([wk, scores]) => {
      const top = scores.reduce((a, b) => (b.points > a.points ? b : a));
      return { week: Number(wk), teamId: top.teamId, name: teamName(TEAMS[top.teamId]), points: top.points };
    })
    .sort((a, b) => a.week - b.week);
}

function computeWeeklyLowScores() {
  return Object.entries(WEEKLY)
    .filter(([wk, scores]) => scores.length > 0)
    .map(([wk, scores]) => {
      const bottom = scores.reduce((a, b) => (b.points < a.points ? b : a));
      return { week: Number(wk), teamId: bottom.teamId, name: teamName(TEAMS[bottom.teamId]), points: bottom.points };
    })
    .sort((a, b) => a.week - b.week);
}

function computeMoneyTracker(champCheckboxChecked) {
  const highScores = computeWeeklyHighScores();
  const weeklyWinCounts = {};
  highScores.forEach(h => { weeklyWinCounts[h.teamId] = (weeklyWinCounts[h.teamId] || 0) + 1; });

  const standings = computeStandardStandings(); // already sorted, rank 0 = 1st place

  return Object.values(TEAMS).map(t => {
    const wins = weeklyWinCounts[t.id] || 0;
    let moneyWon = wins * WEEKLY_PRIZE;
    if (champCheckboxChecked) {
      const rank = standings.findIndex(s => String(s.id) === String(t.id));
      if (rank === 0) moneyWon += FIRST_PLACE_PRIZE;
      else if (rank === 1) moneyWon += SECOND_PLACE_PRIZE;
    }
    return {
      id: t.id,
      name: teamName(t),
      weeklyWins: wins,
      moneyWon,
      buyIn: BUY_IN,
      net: moneyWon - BUY_IN
    };
  }).sort((a, b) => b.net - a.net);
}

function renderMoneyTable(champCheckboxChecked) {
  const rows = computeMoneyTracker(champCheckboxChecked);
  return `
    <table>
      <thead><tr><th></th><th>Team</th><th class="num">Weekly Wins</th><th class="num">Money Won</th><th class="num">Buy-In Owed</th><th class="num">Net</th></tr></thead>
      <tbody>
        ${rows.map((t, i) => `
          <tr class="${i === 0 ? 'rank1' : ''}">
            <td class="rank">${i + 1}</td>
            <td class="team">${t.name}</td>
            <td class="num">${t.weeklyWins}</td>
            <td class="num">$${t.moneyWon}</td>
            <td class="num">$${t.buyIn}</td>
            <td class="num" style="color:${t.net >= 0 ? 'var(--win)' : 'var(--loss)'}">${t.net >= 0 ? '+' : '-'}$${Math.abs(t.net)}</td>
          </tr>`).join('')}
      </tbody>
    </table>
  `;
}

// ESPN's mBoxscore response for a given scoringPeriodId includes matchup
// entries for the WHOLE season, not just that week -- so every consumer of
// weeklyBoxscores must filter to m.matchupPeriodId === week, or unplayed
// future weeks (all-zero scores) get counted as extra ties/games.
// It also returns an entry for the current week before it's actually been
// played, with everyone at 0 points -- so we additionally only count a week
// if WEEKLY (built from real, posted scores) confirms it's actually happened.
function buildOptimalWeeklyScores() {
  const weeklyScores = {}; // week -> [{teamId, points}]
  const weeklyBox = (LEAGUE && LEAGUE.weeklyBoxscores) || {};
  Object.entries(weeklyBox).forEach(([wk, matchups]) => {
    const week = Number(wk);
    if (!WEEKLY[week] || WEEKLY[week].length === 0) return; // week hasn't been played yet
    const real = (matchups || []).filter(m => m.matchupPeriodId === week);
    real.forEach(m => {
      if (!m.home) return;
      weeklyScores[week] = weeklyScores[week] || [];
      weeklyScores[week].push({ teamId: m.home.teamId, points: computeOptimalScore(m.home, week) });
      if (m.away) {
        weeklyScores[week].push({ teamId: m.away.teamId, points: computeOptimalScore(m.away, week) });
      }
    });
  });
  return weeklyScores;
}

function computeWhatIfStandings() {
  const tally = {};
  Object.keys(TEAMS).forEach(id => { tally[id] = { wins: 0, losses: 0, ties: 0, pf: 0 }; });

  const weeklyBox = (LEAGUE && LEAGUE.weeklyBoxscores) || {};
  Object.entries(weeklyBox).forEach(([wk, matchups]) => {
    const week = Number(wk);
    if (!WEEKLY[week] || WEEKLY[week].length === 0) return; // week hasn't been played yet
    const real = (matchups || []).filter(m => m.matchupPeriodId === week);
    real.forEach(m => {
      if (!m.home) return;
      const homeId = m.home.teamId;
      const homeOpt = computeOptimalScore(m.home, week);
      if (!tally[homeId]) tally[homeId] = { wins: 0, losses: 0, ties: 0, pf: 0 };
      tally[homeId].pf += homeOpt;

      if (m.away) {
        const awayId = m.away.teamId;
        const awayOpt = computeOptimalScore(m.away, week);
        if (!tally[awayId]) tally[awayId] = { wins: 0, losses: 0, ties: 0, pf: 0 };
        tally[awayId].pf += awayOpt;

        if (homeOpt > awayOpt) { tally[homeId].wins++; tally[awayId].losses++; }
        else if (awayOpt > homeOpt) { tally[awayId].wins++; tally[homeId].losses++; }
        else { tally[homeId].ties++; tally[awayId].ties++; }
      }
    });
  });

  return Object.entries(tally).map(([id, v]) => ({
    id, name: teamName(TEAMS[id]), ...v
  })).sort((a, b) => b.wins - a.wins || b.pf - a.pf);
}

function computeMedianWhatIfStandings() {
  const weeklyOptimal = buildOptimalWeeklyScores();
  const tally = {};
  Object.keys(TEAMS).forEach(id => { tally[id] = { wins: 0, losses: 0, ties: 0, pf: 0 }; });

  Object.entries(weeklyOptimal).forEach(([wk, scores]) => {
    if (scores.length < 2) return;
    const med = median(scores.map(s => s.points));
    scores.forEach(s => {
      if (!tally[s.teamId]) tally[s.teamId] = { wins: 0, losses: 0, ties: 0, pf: 0 };
      tally[s.teamId].pf += s.points;
      if (s.points > med) tally[s.teamId].wins++;
      else if (s.points < med) tally[s.teamId].losses++;
      else tally[s.teamId].ties++;
    });
  });

  return Object.entries(tally).map(([id, v]) => ({
    id, name: teamName(TEAMS[id]), ...v
  })).sort((a, b) => b.wins - a.wins || b.pf - a.pf);
}

// Maps team id -> its W-L(-T) record string for a given standings list,
// e.g. "6-3" or "6-3-1" if there are ties.
function recordMap(list) {
  const map = {};
  list.forEach(t => {
    map[t.id] = `${t.wins}-${t.losses}${t.ties ? '-' + t.ties : ''}`;
  });
  return map;
}

// Per-team, per-week actual result (W/L/T), completed weeks only, in
// chronological order -- used to compute current streaks.
function buildTeamWeeklyResults() {
  const results = {};
  Object.keys(TEAMS).forEach(id => { results[id] = []; });
  const weeks = Object.keys(MATCHUPS_BY_WEEK).map(Number).sort((a, b) => a - b);
  weeks.forEach(week => {
    if (!WEEKLY[week] || WEEKLY[week].length === 0) return; // only completed weeks
    (MATCHUPS_BY_WEEK[week] || []).forEach(m => {
      if (m.awayScore === null || m.awayId === null) return; // bye week
      const homeRes = m.homeScore > m.awayScore ? 'W' : (m.homeScore < m.awayScore ? 'L' : 'T');
      const awayRes = m.awayScore > m.homeScore ? 'W' : (m.awayScore < m.homeScore ? 'L' : 'T');
      if (!results[m.homeId]) results[m.homeId] = [];
      if (!results[m.awayId]) results[m.awayId] = [];
      results[m.homeId].push({ week, result: homeRes });
      results[m.awayId].push({ week, result: awayRes });
    });
  });
  return results;
}

function formatStreak(resultsArr) {
  if (!resultsArr || resultsArr.length === 0) return { label: '—', cls: '' };
  const sorted = [...resultsArr].sort((a, b) => a.week - b.week);
  const last = sorted[sorted.length - 1].result;
  let count = 0;
  for (let i = sorted.length - 1; i >= 0; i--) {
    if (sorted[i].result === last) count++;
    else break;
  }
  const cls = last === 'W' ? 'streak-w' : last === 'L' ? 'streak-l' : 'streak-t';
  return { label: `${last}${count}`, cls };
}

function streakMap() {
  const results = buildTeamWeeklyResults();
  const map = {};
  Object.entries(results).forEach(([id, arr]) => { map[id] = formatStreak(arr); });
  return map;
}

// Luck Index: actual wins minus median wins. Positive = winning more than
// their scoring alone would predict; negative = the reverse.
function luckIndexMap(standard, med) {
  const medById = {};
  med.forEach(t => { medById[t.id] = t; });
  const map = {};
  standard.forEach(t => {
    const m = medById[t.id];
    map[t.id] = m ? (t.wins - m.wins) : 0;
  });
  return map;
}

// Manager Efficiency %: actual points scored / optimal lineup points, over
// completed weeks only (both standard.pf and whatIf.pf are already scoped
// to completed weeks).
function efficiencyMap(standard, whatIf) {
  const whatIfById = {};
  whatIf.forEach(t => { whatIfById[t.id] = t; });
  const map = {};
  standard.forEach(t => {
    const w = whatIfById[t.id];
    map[t.id] = (w && w.pf > 0) ? (t.pf / w.pf) * 100 : null;
  });
  return map;
}

// Cumulative Points Left on Bench: optimal points minus actual points,
// summed across the season.
function benchPointsMap(standard, whatIf) {
  const whatIfById = {};
  whatIf.forEach(t => { whatIfById[t.id] = t; });
  const map = {};
  standard.forEach(t => {
    const w = whatIfById[t.id];
    map[t.id] = w ? (w.pf - t.pf) : 0;
  });
  return map;
}

function renderMatchupsTab() {
  const weeks = Object.keys(MATCHUPS_BY_WEEK).map(Number).sort((a, b) => a - b);
  const container = document.getElementById('view-matchups');
  if (weeks.length === 0) {
    container.innerHTML = '<p class="placeholder">No matchup data found.</p>';
    return;
  }
  container.innerHTML = `
    <div class="week-picker">
      <label for="weekSelect">Week</label>
      <select id="weekSelect"></select>
    </div>
    <div id="matchupGrid" class="matchup-grid"></div>
  `;
  const sel = document.getElementById('weekSelect');
  weeks.forEach(w => {
    const opt = document.createElement('option');
    opt.value = w; opt.textContent = 'Week ' + w;
    sel.appendChild(opt);
  });
  sel.value = LEAGUE.currentWeek && weeks.includes(LEAGUE.currentWeek) ? LEAGUE.currentWeek : weeks[weeks.length - 1];
  sel.addEventListener('change', () => renderMatchupGrid(Number(sel.value)));
  renderMatchupGrid(Number(sel.value));
}

function renderMatchupGrid(week) {
  const list = MATCHUPS_BY_WEEK[week] || [];
  const grid = document.getElementById('matchupGrid');
  grid.innerHTML = list.map(m => {
    const home = TEAMS[m.homeId], away = TEAMS[m.awayId];
    const homeWin = m.awayScore !== null && m.homeScore > m.awayScore;
    const awayWin = m.awayScore !== null && m.awayScore > m.homeScore;
    return `
      <div class="matchup-card" onclick="openBoxScore(${week}, ${m.homeId}, ${m.awayId})">
        <div class="side home ${homeWin ? 'winner' : ''}">
          <div class="name">${teamName(home)}</div>
          <div class="score">${m.homeScore.toFixed(1)}</div>
        </div>
        <div class="vs">WK ${week}</div>
        <div class="side away ${awayWin ? 'winner' : ''}">
          <div class="name">${teamName(away)}</div>
          <div class="score">${m.awayScore !== null ? m.awayScore.toFixed(1) : '—'}</div>
        </div>
      </div>`;
  }).join('') || '<p class="placeholder">No matchups this week.</p>';
}

function findBoxscoreMatchup(week, homeId, awayId) {
  const wkData = (LEAGUE.weeklyBoxscores || {})[String(week)] || [];
  if (wkData.length === 0) {
    console.warn(`No box score data at all for week ${week}. Available weeks:`, Object.keys(LEAGUE.weeklyBoxscores || {}));
  }
  // ESPN's mBoxscore response includes the full season schedule, not just
  // the requested week -- filter to matchupPeriodId === week so we don't
  // accidentally grab a different week's matchup for the same team.
  const match = wkData.find(m =>
    m.matchupPeriodId === week &&
    ((m.home && m.home.teamId === homeId) || (m.away && m.away.teamId === awayId))
  );
  if (!match) {
    console.warn(`No matchup found for week ${week}, homeId ${homeId}, awayId ${awayId}. Week data:`, wkData);
  }
  return match;
}

function getRosterEntries(sideData) {
  if (!sideData) return [];
  const roster = sideData.rosterForCurrentScoringPeriod || sideData.rosterForMatchupPeriod || sideData.roster;
  return (roster && roster.entries) || [];
}

function getPlayerPoints(entry, week) {
  const ppe = entry.playerPoolEntry || entry;
  if (typeof ppe.appliedStatTotal === 'number') return ppe.appliedStatTotal;
  if (typeof entry.appliedStatTotal === 'number') return entry.appliedStatTotal;
  const player = ppe.player;
  if (player && Array.isArray(player.stats)) {
    const stat = player.stats.find(s => s.scoringPeriodId === week && (s.statSourceId === 0 || s.statSourceId === undefined));
    if (stat && typeof stat.appliedTotal === 'number') return stat.appliedTotal;
  }
  return null;
}

// Starter slot display order: QB, RB, RB, WR, WR, TE, FLEX, D/ST, K
const SLOT_PRIORITY = { 0: 0, 2: 1, 4: 2, 6: 3, 23: 4, 16: 5, 17: 6 };
// Which starter slots a bench player can be checked against, expressed as
// the lineupSlotId(s) that must appear in the player's eligibleSlots list
const SLOT_ELIGIBILITY_CHECK = {
  0: [0],        // QB replaced only by QB
  2: [2],        // RB replaced only by RB
  4: [4],        // WR replaced only by WR
  6: [6],        // TE replaced only by TE
  16: [16],      // D/ST replaced only by D/ST
  17: [17],      // K replaced only by K
  23: [2, 4, 6]  // FLEX replaced by RB, WR, or TE
};
// Fallback if a player has no eligibleSlots array: map defaultPositionId instead
const POSITION_ID_FALLBACK = { 0: [1], 2: [2], 4: [3], 6: [4], 16: [16], 17: [5], 23: [2, 3, 4] };

function getPlayer(entry) {
  return (entry.playerPoolEntry && entry.playerPoolEntry.player) || entry.player;
}

function benchCandidateEligible(benchEntry, starterSlotId) {
  const player = getPlayer(benchEntry);
  if (!player) return false;
  if (Array.isArray(player.eligibleSlots) && player.eligibleSlots.length) {
    const needed = SLOT_ELIGIBILITY_CHECK[starterSlotId] || [];
    return needed.some(s => player.eligibleSlots.includes(s));
  }
  const needed = POSITION_ID_FALLBACK[starterSlotId] || [];
  return needed.includes(player.defaultPositionId);
}

function rosterRows(sideData, week) {
  const entries = getRosterEntries(sideData);
  const starters = entries
    .filter(e => e.lineupSlotId !== 20 && e.lineupSlotId !== 21)
    .sort((a, b) => (SLOT_PRIORITY[a.lineupSlotId] ?? 99) - (SLOT_PRIORITY[b.lineupSlotId] ?? 99));
  const bench = entries.filter(e => e.lineupSlotId === 20 || e.lineupSlotId === 21);

  const starterRow = e => {
    const player = getPlayer(e);
    const name = player ? player.fullName : 'Unknown';
    const pts = getPlayerPoints(e, week);
    const outperformed = pts !== null && bench.some(b => {
      if (!benchCandidateEligible(b, e.lineupSlotId)) return false;
      const bPts = getPlayerPoints(b, week);
      return bPts !== null && bPts > pts;
    });
    return `<tr class="${outperformed ? 'outperformed' : ''}"><td class="slot">${SLOT_NAMES[e.lineupSlotId] || e.lineupSlotId}</td><td>${name}</td><td class="num">${pts !== null ? pts.toFixed(1) : '—'}</td></tr>`;
  };

  const benchRow = e => {
    const player = getPlayer(e);
    const name = player ? player.fullName : 'Unknown';
    const pts = getPlayerPoints(e, week);
    const shouldStart = pts !== null && starters.some(s => {
      if (!benchCandidateEligible(e, s.lineupSlotId)) return false;
      const sPts = getPlayerPoints(s, week);
      return sPts !== null && pts > sPts;
    });
    return `<tr class="${shouldStart ? 'should-start' : ''}"><td class="slot">${SLOT_NAMES[e.lineupSlotId] || e.lineupSlotId}</td><td>${name}</td><td class="num">${pts !== null ? pts.toFixed(1) : '—'}</td></tr>`;
  };

  let html = starters.map(starterRow).join('');
  if (bench.length) {
    html += `<tr class="bench-divider"><td colspan="3">Bench</td></tr>` + bench.map(benchRow).join('');
  }
  if (!entries.length) {
    html = `<tr><td colspan="3" class="placeholder">No roster data for this week.</td></tr>`;
  }
  return html;
}

function getPositionGroup(entry) {
  const player = getPlayer(entry);
  if (!player) return null;
  const slots = player.eligibleSlots;
  if (Array.isArray(slots) && slots.length) {
    if (slots.includes(0)) return 'QB';
    if (slots.includes(2)) return 'RB';
    if (slots.includes(4)) return 'WR';
    if (slots.includes(6)) return 'TE';
    if (slots.includes(16)) return 'DST';
    if (slots.includes(17)) return 'K';
  }
  const map = { 1: 'QB', 2: 'RB', 3: 'WR', 4: 'TE', 5: 'K', 16: 'DST' };
  return map[player.defaultPositionId] || null;
}

function computeOptimalScore(sideData, week) {
  const entries = getRosterEntries(sideData);
  const withPoints = entries.map(e => ({ e, pts: getPlayerPoints(e, week) ?? 0, pos: getPositionGroup(e) }));

  const byPos = { QB: [], RB: [], WR: [], TE: [], K: [], DST: [] };
  withPoints.forEach(x => { if (byPos[x.pos]) byPos[x.pos].push(x); });
  Object.values(byPos).forEach(arr => arr.sort((a, b) => b.pts - a.pts));

  let total = 0;
  const used = new Set();

  function takeTop(pos, count) {
    const arr = byPos[pos] || [];
    let taken = 0;
    for (const item of arr) {
      if (taken >= count) break;
      used.add(item.e);
      total += item.pts;
      taken++;
    }
  }

  takeTop('QB', 1);
  takeTop('RB', 2);
  takeTop('WR', 2);
  takeTop('TE', 1);
  takeTop('DST', 1);
  takeTop('K', 1);

  // FLEX: best remaining RB/WR/TE not already used in a fixed slot
  const flexCandidates = ['RB', 'WR', 'TE']
    .flatMap(pos => byPos[pos] || [])
    .filter(x => !used.has(x.e))
    .sort((a, b) => b.pts - a.pts);
  if (flexCandidates.length) total += flexCandidates[0].pts;

  return total;
}

function openBoxScore(week, homeId, awayId) {
  document.querySelectorAll('nav.tabs button').forEach(b => b.classList.remove('active'));
  document.querySelector('nav.tabs button[data-tab="boxscore"]').classList.add('active');
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  document.getElementById('view-boxscore').classList.add('active');

  const match = findBoxscoreMatchup(week, homeId, awayId);
  const home = TEAMS[homeId], away = TEAMS[awayId];
  const list = MATCHUPS_BY_WEEK[week] || [];
  const summary = list.find(m => m.homeId === homeId && m.awayId === awayId) || {};

  const homeRoster = match ? rosterRows(match.home, week) : '<tr><td colspan="3" class="placeholder">No box score data loaded for this week.</td></tr>';
  const awayRoster = match ? rosterRows(match.away, week) : '<tr><td colspan="3" class="placeholder">No box score data loaded for this week.</td></tr>';

  const homeOptimal = match ? computeOptimalScore(match.home, week) : null;
  const awayOptimal = match ? computeOptimalScore(match.away, week) : null;

  const whatIf = (actual, optimal) => {
    if (optimal === null) return '';
    const diff = optimal - actual;
    return `<div class="whatif">What-if: ${optimal.toFixed(1)}${diff > 0.05 ? ` <span class="whatif-diff">(+${diff.toFixed(1)})</span>` : ''}</div>`;
  };

  document.getElementById('view-boxscore').innerHTML = `
    <span class="back-link" onclick="backToMatchups()">&larr; Back to matchups</span>
    <div class="box-header">
      <div class="home">
        <div class="name">${teamName(home)}</div>
        <div class="score">${(summary.homeScore || 0).toFixed(1)}</div>
        ${whatIf(summary.homeScore || 0, homeOptimal)}
      </div>
      <div class="vs">WK ${week}</div>
      <div class="away">
        <div class="name">${teamName(away)}</div>
        <div class="score">${(summary.awayScore || 0).toFixed(1)}</div>
        ${whatIf(summary.awayScore || 0, awayOptimal)}
      </div>
    </div>
    <div class="roster-grid">
      <table><thead><tr><th></th><th>${teamName(home)}</th><th class="num">Pts</th></tr></thead><tbody>${homeRoster}</tbody></table>
      <table><thead><tr><th></th><th>${teamName(away)}</th><th class="num">Pts</th></tr></thead><tbody>${awayRoster}</tbody></table>
    </div>
  `;
}

function backToMatchups() {
  document.querySelectorAll('nav.tabs button').forEach(b => b.classList.remove('active'));
  document.querySelector('nav.tabs button[data-tab="matchups"]').classList.add('active');
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  document.getElementById('view-matchups').classList.add('active');
}

// ---------- Team Comparison tab ----------

const POSITION_LABELS = { QB: 'QB', RB: 'RB', WR: 'WR', TE: 'TE', K: 'K', DST: 'D/ST' };

let weeklyScoringSort = { key: 'avg', dir: 'desc' };
let positionBreakdownSort = { key: 'total', dir: 'desc' };

// Aggregates each team's STARTED points by position group (actual position,
// not lineup slot -- so a RB started at FLEX still counts under RB), across
// all completed weeks.
function computePositionBreakdown() {
  const totals = {};
  Object.keys(TEAMS).forEach(id => { totals[id] = { QB: 0, RB: 0, WR: 0, TE: 0, K: 0, DST: 0 }; });

  const weeklyBox = (LEAGUE && LEAGUE.weeklyBoxscores) || {};
  Object.entries(weeklyBox).forEach(([wk, matchups]) => {
    const week = Number(wk);
    if (!WEEKLY[week] || WEEKLY[week].length === 0) return; // only completed weeks
    const real = (matchups || []).filter(m => m.matchupPeriodId === week);
    real.forEach(m => {
      [m.home, m.away].forEach(sideData => {
        if (!sideData) return;
        const teamId = sideData.teamId;
        if (!totals[teamId]) totals[teamId] = { QB: 0, RB: 0, WR: 0, TE: 0, K: 0, DST: 0 };
        const entries = getRosterEntries(sideData).filter(e => e.lineupSlotId !== 20 && e.lineupSlotId !== 21);
        entries.forEach(e => {
          const pos = getPositionGroup(e);
          const pts = getPlayerPoints(e, week);
          if (pos && totals[teamId][pos] !== undefined && pts !== null) {
            totals[teamId][pos] += pts;
          }
        });
      });
    });
  });

  return Object.entries(totals).map(([id, positions]) => {
    const total = Object.values(positions).reduce((a, b) => a + b, 0);
    return { id, name: teamName(TEAMS[id]), positions, total };
  }).sort((a, b) => b.total - a.total);
}

function computeWeeklyScoringTable() {
  const weeks = Object.keys(WEEKLY).map(Number).sort((a, b) => a - b);
  const rows = Object.keys(TEAMS).map(id => {
    const scores = {};
    weeks.forEach(w => {
      const entry = (WEEKLY[w] || []).find(s => String(s.teamId) === String(id));
      scores[w] = entry ? entry.points : null;
    });
    const played = weeks.filter(w => scores[w] !== null);
    const avg = played.length ? played.reduce((sum, w) => sum + scores[w], 0) / played.length : null;
    return { id, name: teamName(TEAMS[id]), scores, avg };
  });
  return { weeks, rows };
}

function renderPositionBreakdownTable() {

    else { av = a.positions[key] || 0; bv = b.positions[key] || 0; }
    if (typeof av === 'string') return dir === 'asc' ? av.localeCompare(bv) : bv.localeCompare(av);
    return dir === 'asc' ? av - bv : bv - av;
  });

  const arrow = k => positionBreakdownSort.key === k ? (positionBreakdownSort.dir === 'asc' ? ' \u25B2' : ' \u25BC') : '';

function setPositionBreakdownSort(key) {
  if (positionBreakdownSort.key === key) {
    positionBreakdownSort.dir = positionBreakdownSort.dir === 'asc' ? 'desc' : 'asc';
  } else {
    positionBreakdownSort.key = key;
    positionBreakdownSort.dir = key === 'name' ? 'asc' : 'desc';
  }
  renderPositionBreakdownTable();
}

// Rotisserie-style scoring: within each position, the team with the most
// total points earns N points (N = number of teams), next earns N-1, down
// to 1 for last place. Teams tied at a position split the points those tied
// ranks would otherwise earn -- e.g. with 12 teams, two teams tied for the
// top spot (which would earn 12 and 11) each get 11.5, and the next team
// still gets 10 (3rd place, unaffected by the tie above it).
function computeRotoScoring() {
  const breakdown = computePositionBreakdown();
  const posKeys = Object.keys(POSITION_LABELS);
  const N = breakdown.length;

  const rotoByTeam = {};
  breakdown.forEach(t => { rotoByTeam[t.id] = { id: t.id, name: t.name }; });

  posKeys.forEach(pos => {
    const sortedByPos = [...breakdown].sort((a, b) => (b.positions[pos] || 0) - (a.positions[pos] || 0));
    let i = 0;
    while (i < sortedByPos.length) {
      let j = i;
      while (j + 1 < sortedByPos.length && (sortedByPos[j + 1].positions[pos] || 0) === (sortedByPos[i].positions[pos] || 0)) j++;
      // ranks i+1..j+1 (1-indexed) are tied; average them
      let rankSum = 0;
      for (let r = i + 1; r <= j + 1; r++) rankSum += r;
      const avgRank = rankSum / (j - i + 1);
      const points = N - avgRank + 1;
      for (let k = i; k <= j; k++) {
        rotoByTeam[sortedByPos[k].id][pos] = points;
      }
      i = j + 1;
    }
  });

  Object.values(rotoByTeam).forEach(t => {
    t.total = posKeys.reduce((sum, pos) => sum + (t[pos] || 0), 0);
  });

  return { rows: Object.values(rotoByTeam), teamsCount: N };
}

let rotoScoringSort = { key: 'total', dir: 'desc' };

function renderRotoScoringTable() {
  const { rows, teamsCount } = computeRotoScoring();
  const posKeys = Object.keys(POSITION_LABELS);
  const key = rotoScoringSort.key;
  const dir = rotoScoringSort.dir;

  const sorted = [...rows].sort((a, b) => {
    let av, bv;
    if (key === 'name') { av = a.name; bv = b.name; }
    else { av = a[key] || 0; bv = b[key] || 0; }
    if (typeof av === 'string') return dir === 'asc' ? av.localeCompare(bv) : bv.localeCompare(av);
    return dir === 'asc' ? av - bv : bv - av;
  });

  const arrow = k => rotoScoringSort.key === k ? (rotoScoringSort.dir === 'asc' ? ' \u25B2' : ' \u25BC') : '';
  const fmt = v => (v === undefined || v === null) ? '—' : (Number.isInteger(v) ? `${v}` : v.toFixed(1));

  const wrap = document.getElementById('rotoScoringTableWrap');
  if (!wrap) return;
  wrap.innerHTML = `
    <div class="table-scroll">
    <table>
      <thead><tr>
        <th class="sortable" onclick="setRotoScoringSort('name')">Team${arrow('name')}</th>
        ${posKeys.map(k => `<th class="num sortable" onclick="setRotoScoringSort('${k}')">${POSITION_LABELS[k]}${arrow(k)}</th>`).join('')}
        <th class="num sortable" onclick="setRotoScoringSort('total')">Total${arrow('total')}</th>
      </tr></thead>
      <tbody>
        ${sorted.map((t, i) => `
          <tr class="${i === 0 ? 'rank1' : ''}">
            <td class="team">${t.name}</td>
            ${posKeys.map(k => `<td class="num">${fmt(t[k])}</td>`).join('')}
            <td class="num">${fmt(t.total)}</td>
          </tr>`).join('') || `<tr><td colspan="${posKeys.length + 2}" class="placeholder">No box score data yet.</td></tr>`}
      </tbody>
    </table>
    </div>
  `;
}

function setRotoScoringSort(key) {
  if (rotoScoringSort.key === key) {
    rotoScoringSort.dir = rotoScoringSort.dir === 'asc' ? 'desc' : 'asc';
  } else {
    rotoScoringSort.key = key;
    rotoScoringSort.dir = key === 'name' ? 'asc' : 'desc';
  }

// ---------- Draft Recap tab ----------
// Methodology: for each drafted player, compare where they were taken among
// others at their position (Draft Position Rank -- e.g. "3rd RB off the
// board") to how they finished the season in points among all drafted
// players at that position (Finish Position Rank). Grade = Draft Rank minus
// Finish Rank: positive means they outperformed their draft slot (steal),
// negative means they underperformed it (bust). Points totals include bench
// scoring -- this grades the pick itself, not how the manager used it.
//
// Data limitation: a player's season points are built by scanning every
// week's box score data for that player's id. A player who was drafted,
// then dropped and never picked up by anyone else the rest of the season,
// will have an incomplete point total (we only see rostered players) and
// is flagged as such rather than silently graded on partial data.

let draftPlayerInfoCache = null;

// Maps a raw player object's position fields (from the full player-pool
// fetch, not a box score entry) to our QB/RB/WR/TE/K/DST groups -- same
// convention as getPositionGroup(), just operating on plain fields instead
// of a roster entry.
function positionGroupFromRaw(defaultPositionId, eligibleSlots) {
  if (Array.isArray(eligibleSlots) && eligibleSlots.length) {
    if (eligibleSlots.includes(0)) return 'QB';
    if (eligibleSlots.includes(2)) return 'RB';
    if (eligibleSlots.includes(4)) return 'WR';
    if (eligibleSlots.includes(6)) return 'TE';
    if (eligibleSlots.includes(16)) return 'DST';
    if (eligibleSlots.includes(17)) return 'K';
  }
  const map = { 1: 'QB', 2: 'RB', 3: 'WR', 4: 'TE', 5: 'K', 16: 'DST' };
  return map[defaultPositionId] || null;
}

// Fallback source: reconstructs each player's season total by scanning
// every week's box score data for them. Only sees players while they're
// actually on a roster somewhere -- a player who's dropped and never
// picked up again for the rest of the season will show an incomplete
// total here. Kept as a fallback for when the full player-pool fetch
// (below) doesn't have an entry for someone.
function buildBoxScorePlayerInfo() {
  const info = {}; // playerId -> { name, pos, points }

  const weeklyBox = (LEAGUE && LEAGUE.weeklyBoxscores) || {};
  Object.entries(weeklyBox).forEach(([wk, matchups]) => {
    const week = Number(wk);
    if (!WEEKLY[week] || WEEKLY[week].length === 0) return; // only completed weeks
    const real = (matchups || []).filter(m => m.matchupPeriodId === week);
    real.forEach(m => {
      [m.home, m.away].forEach(sideData => {
        if (!sideData) return;
        getRosterEntries(sideData).forEach(e => {
          const player = getPlayer(e);
          if (!player || player.id === undefined) return;
          const pts = getPlayerPoints(e, week);
          if (!info[player.id]) {
            info[player.id] = { name: player.fullName || 'Unknown Player', pos: getPositionGroup(e), points: 0 };
          }
          if (pts !== null) info[player.id].points += pts;
        });
      });
    });
  });

  return info;
}

// Preferred source: ESPN's full player-pool fetch (seasonPlayerStats in the
// synced JSON) covers every rosterable player league-wide, including ones
// nobody currently owns -- so a player who was dropped and never picked up
// again still has a correct, complete season total here. This is what
// solves the box-score method's blind spot. Falls back to the box-score
// -derived value for any player missing from the pool fetch (e.g. an older
// synced JSON that predates this feature, or a player the pool fetch
// simply didn't return), so this never regresses below the old behavior.
function buildDraftPlayerInfo() {
  if (draftPlayerInfoCache) return draftPlayerInfoCache;

  const boxScoreInfo = buildBoxScorePlayerInfo();
  const seasonStats = (LEAGUE && LEAGUE.seasonPlayerStats) || {};

  const info = {};
  Object.entries(boxScoreInfo).forEach(([pid, v]) => {
    info[pid] = { name: v.name, pos: v.pos, points: v.points, source: 'boxscore' };
  });

  Object.entries(seasonStats).forEach(([pid, v]) => {
    if (v.points === null || v.points === undefined) return; // no usable total; keep box-score fallback
    const existing = info[pid];
    info[pid] = {
      name: v.name || (existing && existing.name) || 'Unknown Player',
      pos: positionGroupFromRaw(v.defaultPositionId, v.eligibleSlots) || (existing && existing.pos) || null,
      points: v.points,
      source: 'seasonPool'
    };
  });

  draftPlayerInfoCache = info;
  return info;
}

function computeDraftRecap() {
  const picks = ((LEAGUE && LEAGUE.draftPicks) || []).slice();
  if (picks.length === 0) return [];

  const playerInfo = buildDraftPlayerInfo();
  const teamsCount = Object.keys(TEAMS).length;

  const enriched = picks.map(p => {
    const overall = p.overallPickNumber || ((p.roundId - 1) * teamsCount + p.roundPickNumber);
    const info = playerInfo[p.playerId];
    return {
      overall,
      round: p.roundId,
      roundPick: p.roundPickNumber,
      teamId: p.teamId,
      teamName: teamName(TEAMS[p.teamId]),
      playerId: p.playerId,
      playerName: info ? info.name : 'Unknown Player',
      pos: info ? info.pos : null,
      points: info ? info.points : null,
      dataIncomplete: !info
    };
  }).sort((a, b) => a.overall - b.overall);

  // Rank within each position: draft order (by overall pick) vs. finish (by points)
  const posGroups = {};
  enriched.forEach(p => {
    if (!p.pos) return;
    posGroups[p.pos] = posGroups[p.pos] || [];
    posGroups[p.pos].push(p);
  });

  Object.entries(posGroups).forEach(([pos, group]) => {
    const byDraft = [...group].sort((a, b) => a.overall - b.overall);
    byDraft.forEach((p, i) => { p.draftPosRank = i + 1; });

    const byFinish = [...group].sort((a, b) => (b.points || 0) - (a.points || 0));
    byFinish.forEach((p, i) => { p.finishPosRank = i + 1; });
  });

  enriched.forEach(p => {
    p.grade = (p.draftPosRank && p.finishPosRank) ? (p.draftPosRank - p.finishPosRank) : null;
  });

  // Weighted Grade: accounts for BOTH round drafted and the fact that raw
  // points aren't comparable across positions (e.g. the best TE that year
  // might score about the same raw points as a middling QB or WR, but that
  // TE total is exceptional for the position while the QB/WR total is not).
  //
  // 1. Within each position, convert points to a z-score against that
  //    position's own mean/stdev (drafted players only) -- this puts every
  //    position on the same normalized scale.
  // 2. Within each ROUND, average those z-scores across all positions to
  //    get "what a pick in this round was expected to return."
  // 3. Weighted Grade = player's z-score minus their round's expected
  //    z-score. Positive = outperformed the bar for that round once
  //    position scale is accounted for; negative = underperformed it.
  Object.values(posGroups).forEach(group => {
    const pts = group.map(p => p.points).filter(v => v !== null && v !== undefined);
    if (pts.length === 0) return;
    const mean = pts.reduce((a, b) => a + b, 0) / pts.length;
    const variance = pts.length > 1
      ? pts.reduce((sum, v) => sum + Math.pow(v - mean, 2), 0) / (pts.length - 1)
      : 0;
    const stdev = Math.sqrt(variance);
    group.forEach(p => {
      if (p.points === null || p.points === undefined) { p.zScore = null; return; }
      p.zScore = stdev > 0 ? (p.points - mean) / stdev : 0;
    });
  });

  const roundGroups = {};
  enriched.forEach(p => {
    if (p.zScore === null || p.zScore === undefined) return;
    roundGroups[p.round] = roundGroups[p.round] || [];
    roundGroups[p.round].push(p.zScore);
  });
  const roundExpectedZ = {};
  Object.entries(roundGroups).forEach(([round, zScores]) => {
    roundExpectedZ[round] = zScores.reduce((a, b) => a + b, 0) / zScores.length;
  });

  enriched.forEach(p => {
    if (p.zScore === null || p.zScore === undefined || roundExpectedZ[p.round] === undefined) {
      p.weightedGrade = null;
    } else {
      p.weightedGrade = p.zScore - roundExpectedZ[p.round];
    }
  });

  return enriched;
}

let draftRecapFilters = { team: 'all', pos: 'all' };

      </p>
      <p class="sub">

        best TE in a season might score about the same raw points as a middling QB or WR, but that total is

function applyDraftRecapFilters(picks) {
  return picks.filter(p => {
    if (draftRecapFilters.team !== 'all' && String(p.teamId) !== String(draftRecapFilters.team)) return false;

    return true;
  });
}

            <td class="num">${p.draftPosRank ? p.pos + p.draftPosRank : '—'}</td>
            <td class="num">${p.finishPosRank ? p.pos + p.finishPosRank : '—'}</td>
            <td class="num" style="color:${gradeColor}; font-weight:700;">${gradeLabel}</td>
            <td class="num" style="color:${wgColor}; font-weight:700;">${wgLabel}</td>
          </tr>`;
        }).join('') || '<tr><td colspan="10" class="placeholder">No picks match this filter.</td></tr>'}
      </tbody>
    </table>
    </div>
  `;
}

function setDraftRecapSort(key) {
  if (draftRecapSort.key === key) {
    draftRecapSort.dir = draftRecapSort.dir === 'asc' ? 'desc' : 'asc';
  } else {
    draftRecapSort.key = key;
    draftRecapSort.dir = (key === 'teamName' || key === 'playerName' || key === 'pos') ? 'asc' : 'desc';
  }
  renderDraftRecapTable(applyDraftRecapFilters(draftRecapAllPicks));
}


function renderWeeklyScoringTable() {
  const { weeks, rows } = computeWeeklyScoringTable();
  const key = weeklyScoringSort.key;
  const dir = weeklyScoringSort.dir;

  const sorted = [...rows].sort((a, b) => {
    let av, bv;
    if (key === 'name') { av = a.name; bv = b.name; }
    else if (key === 'avg') { av = a.avg ?? -Infinity; bv = b.avg ?? -Infinity; }
    else { av = a.scores[key] ?? -Infinity; bv = b.scores[key] ?? -Infinity; }
    if (typeof av === 'string') return dir === 'asc' ? av.localeCompare(bv) : bv.localeCompare(av);
    return dir === 'asc' ? av - bv : bv - av;
  });

  const arrow = k => weeklyScoringSort.key === k ? (weeklyScoringSort.dir === 'asc' ? ' \u25B2' : ' \u25BC') : '';

  const wrap = document.getElementById('weeklyScoringTableWrap');
  if (!wrap) return;
  wrap.innerHTML = `
    <div class="table-scroll">
    <table class="tight-table">
      <thead><tr>
        <th class="sortable" onclick="setWeeklyScoringSort('name')">Team${arrow('name')}</th>
        <th class="num sortable" onclick="setWeeklyScoringSort('avg')">Avg${arrow('avg')}</th>
        ${weeks.map(w => `<th class="num sortable" onclick="setWeeklyScoringSort(${w})">Wk ${w}${arrow(w)}</th>`).join('')}
      </tr></thead>
      <tbody>
        ${sorted.map(r => `
          <tr>
            <td class="team">${r.name}</td>
            <td class="num">${r.avg !== null ? r.avg.toFixed(1) : '—'}</td>
            ${weeks.map(w => `<td class="num">${r.scores[w] !== null ? r.scores[w].toFixed(1) : '—'}</td>`).join('')}
          </tr>`).join('') || `<tr><td colspan="${weeks.length + 2}" class="placeholder">No completed weeks yet.</td></tr>`}
      </tbody>
    </table>
    </div>
  `;
}

function setWeeklyScoringSort(key) {
  if (weeklyScoringSort.key === key) {
    weeklyScoringSort.dir = weeklyScoringSort.dir === 'asc' ? 'desc' : 'asc';
  } else {
    weeklyScoringSort.key = key;
    weeklyScoringSort.dir = key === 'name' ? 'asc' : 'desc';
  }
  renderWeeklyScoringTable();
}

document.querySelectorAll('nav.tabs button').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('nav.tabs button').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
    document.getElementById('view-' + btn.dataset.tab).classList.add('active');
    if (btn.dataset.tab === 'teamcompare') renderTeamComparisonTab();
    if (btn.dataset.tab === 'draftrecap') renderDraftRecapTab();
  });
});
</script>
</body>
</html>
